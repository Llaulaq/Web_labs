# Полный вариант compose: приложение + PostgreSQL + Redis (Задание 4, занятие 2)
# Запуск: docker compose -f docker-compose.full.yml up --build
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:secret@db:5432/mydb
      - REDIS_URL=redis://redis:6379
    volumes:
      - app_logs:/var/log/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  pgdata:
  app_logs:
