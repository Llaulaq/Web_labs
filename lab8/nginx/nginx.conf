user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Лимит запросов: защита от перебора и брутфорса (5 r/s на IP)
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    256;
    gzip_types         text/plain text/css application/json application/javascript image/svg+xml;

    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Основной HTTPS-сервер
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;   # TLS 1.0/1.1 отключены
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Заголовки безопасности
        add_header X-Content-Type-Options "nosniff"              always;
        add_header X-Frame-Options "DENY"                        always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000"  always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com"  always;

        # Статика — отдаёт nginx напрямую, без участия приложения
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # API и остальное — проксируем в приложение
        location / {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://app:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Клиентские ошибки — свои страницы
        error_page 404 /static/404.html;
    }
}
